<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate to Indigo-Navy -->
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="aiRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Star Gradient -->
    <linearGradient id="aiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Outer Shield Gradient -->
    <linearGradient id="aiShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#aiBg)" />
  
  <!-- Outer Rim Stroke -->
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="url(#aiRim)" stroke-width="6" />

  <!-- Ambient Internal Glow Sphere -->
  <circle cx="256" cy="256" r="160" fill="#3B82F6" fill-opacity="0.18" filter="url(#aiGlow)" />

  <!-- Outer Apex Neural Shield -->
  <path
    d="M256 64 L416 192 V320 L256 448 L96 320 V192 Z"
    fill="none"
    stroke="url(#aiShield)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.85"
  />

  <!-- Neural Strut Rays -->
  <path
    d="M256 64 V160 M256 352 V448 M96 220 L180 245 M332 267 L416 292"
    stroke="url(#aiShield)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-opacity="0.45"
  />

  <!-- Center 4-Point Radiant Neural Sparkle Core -->
  <path
    d="M256 128 C256 198.7 198.7 256 128 256 C198.7 256 256 313.3 256 384 C256 313.3 313.3 256 384 256 C313.3 256 256 198.7 256 128 Z"
    fill="url(#aiCore)"
    filter="url(#aiGlow)"
  />

  <!-- Top-Right Intelligence Accent Star -->
  <circle cx="396" cy="116" r="32" fill="#38BDF8" />
  <path
    d="M396 74 V158 M354 116 H438"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Bottom-Left Micro Resonance Dot -->
  <circle cx="116" cy="396" r="24" fill="#8B5CF6" />
</svg>
